<style>
:root{

}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#d9d6d0;--card:#efece6;--ink:#222;--dim:#6d6a64;--line:#bdb9b0;--accent:#3a3a3a;--noise:.2}}
:root[data-theme="light"]{--bg:#d9d6d0;--card:#efece6;--ink:#222;--dim:#6d6a64;--line:#bdb9b0;--accent:#3a3a3a;--noise:.2}
*{box-sizing:border-box}
html{color-scheme:dark light}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Alegreya',Georgia,serif;
  display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:var(--noise);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .5 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.45))}
main{position:relative;z-index:1;width:100%;max-width:400px}
.top{text-align:center;margin-bottom:18px}
.top h1{margin:0;font-weight:400;font-size:2.4rem;letter-spacing:.14em;text-transform:lowercase}

.ed input,.ed textarea{width:100%;font:inherit;background:rgba(127,127,127,.12);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:3px 0}
[hidden]{display:none!important}
.av{position:absolute;inset:12px;border-radius:50%;overflow:hidden;border:4px solid var(--card);
  background:radial-gradient(circle,#6b6b6b,#1a1a1a)}
.av video,.av img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
.deco{position:absolute;inset:0;pointer-events:none;width:100%;height:100%;overflow:visible}

.sec{background:rgba(127,127,127,.08);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}

.card{position:relative;margin-top:100px}

.st{transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}
.st:nth-of-type(2){animation-delay:.8s}.st:nth-of-type(3){animation-delay:1.6s}.st:nth-of-type(4){animation-delay:2.4s}

.cn.a{top:40%;left:-15px}.cn.b{top:40%;right:-15px;animation-delay:.8s}.cn.c{bottom:-15px;left:-15px;animation-delay:1.6s}.cn.d{bottom:-15px;right:-15px;animation-delay:2.4s}
@keyframes tw{50%{opacity:.3;transform:scale(.75)}}
.name{background:linear-gradient(100deg,var(--ink) 40%,#fff 50%,var(--ink) 60%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite}
@keyframes sh{from{background-position:120% 0}to{background-position:-120% 0}}

#bgm{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}

#bgrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
#cam-btn{font:inherit;background:var(--ink);color:var(--card);border:0;border-radius:999px;padding:4px 16px;cursor:pointer;margin:4px 0}
#live{position:relative;overflow:hidden}
#lv-wrap video{display:block;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;object-fit:cover}
#lv-wrap iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000}
#lv-heart{font:inherit;font-size:1.1rem;background:rgba(127,127,127,.12);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 16px;cursor:pointer;margin:10px 0}
.fh{position:absolute;bottom:90px;color:#c98f9e;pointer-events:none;animation:fh 1.6s ease-out forwards;font-size:1.4rem}
@keyframes fh{to{transform:translateY(-200px) scale(1.3);opacity:0}}
#bgrow button{font:inherit;background:rgba(127,127,127,.12);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
#bgrow input{width:44px;height:30px;padding:0;margin:0;border:0;background:none}
.notes{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.notes i{position:absolute;bottom:-40px;font-style:normal;color:var(--accent);opacity:0;animation:fl linear infinite;text-shadow:0 0 8px rgba(255,255,255,.25)}
@keyframes fl{0%{transform:translate(0,0) rotate(-12deg);opacity:0}12%{opacity:.5}50%{transform:translate(18px,-55vh) rotate(12deg)}88%{opacity:.5}100%{transform:translate(-14px,-115vh) rotate(-12deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.notes{display:none}}
.cml{max-height:340px;overflow-y:auto}
@media (min-width:600px){main{max-width:520px}.top h1{font-size:2.8rem}}
@media (min-width:960px){
  body{padding:36px 32px 56px}
  main{max-width:1120px;display:grid;grid-template-columns:400px minmax(0,1fr);gap:20px 28px;align-items:start}
  .top{grid-column:1/-1;margin-bottom:0}.top h1{font-size:3.2rem}
  .card{grid-column:1;grid-row:2/span 6;position:sticky;top:12px}
  .show{grid-column:2;margin-top:0}
  .foot{grid-column:1/-1}
  #live:not([hidden]){display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);column-gap:16px;align-items:start}
  #live h2{grid-column:1/-1}
  #lv-wrap{grid-column:1}#lv-heart{grid-column:1;justify-self:start}
  #lv-cm{grid-column:2;grid-row:2/span 2}
  #lv-cm .cml{max-height:420px}
}
.foot{margin-top:16px;text-align:center;color:var(--dim);font-size:.8rem;font-style:italic}
input[type=file]{display:none}
</style>

var ef={i:-1,v:null,t:null};
function openEf(i){
  ef={i:i,v:null,t:null};var ep=i>=0?state.episodes[i]:null;
  $("ef-h").textContent=ep?"Edit episode":"New episode";$("ef-ok").textContent=ep?"save changes":"add episode";
  $("ef-t").value=ep?ep.title:"";$("ef-d").value=ep?(ep.desc||""):"";$("ef-s").textContent=ep?"leave video/thumbnail alone to keep the current ones":"";
  $("epform").hidden=false;$("epform").scrollIntoView({block:"center"});
}
function efPick(kind){
  var inp=document.createElement("input");inp.type="file";inp.accept=kind==="v"?"video/*":"image/*";
  inp.onchange=function(){var f=inp.files[0];if(!f)return;
    if(f.size>20*1024*1024){alert("That file is over 20 MB. Trim or compress it first.");return}
    ef[kind]=f;$("ef-s").textContent=(ef.v?"video: "+ef.v.name:"")+(ef.v&&ef.t?"  ·  ":"")+(ef.t?"thumbnail: "+ef.t.name:"")};
  inp.click();
}
$("addep").onclick=function(){openEf(-1)};
$("ef-v").onclick=function(){efPick("v")};$("ef-i").onclick=function(){efPick("t")};
$("ef-x").onclick=function(){$("epform").hidden=true};
$("ef-ok").onclick=function(){
  var title=$("ef-t").value.trim()||"untitled",desc=$("ef-d").value.trim(),ep;
  if(ef.i<0){
    if(!ef.v){alert("Pick a video first.");return}
    var b=URL.createObjectURL(ef.v);ep={id:Date.now().toString(36),title:title,desc:desc,url:b,_b:b,type:ef.v.type,_f:ef.v};
    state.episodes.push(ep);cur=state.episodes.length-1;
  }else{
    ep=state.episodes[ef.i];ep.title=title;ep.desc=desc;cur=ef.i;
    if(ef.v){var b2=URL.createObjectURL(ef.v);ep.url=b2;ep._b=b2;ep.type=ef.v.type;ep._f=ef.v}
  }
  if(ef.t){ep._tb=URL.createObjectURL(ef.t);ep._tf=ef.t}
  $("epform").hidden=true;renderEps();
};
